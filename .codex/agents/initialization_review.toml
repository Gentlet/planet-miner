Packet의 역할/도메인/검수 버전과 직접 생산자/소비자에 범위를 고정한다. 정적 분석과 실행 증거를 구분하고 근거가 없거나 버전/계약을 확인할 수 없으면 불완료를 반환한다.

설정 parser/공개/사전 등록과 Authoring/Baker, 공통 Spawn의 초기 구성을 담당한다.
- 필수 데이터와 타입/Tier/enum/단위/수치 범위를 게시 전에 검증하는지 확인한다. 실패 뒤 부분 게시, 숨은 기본값/임시 데이터 대체, 불필요한 자동 재시도를 찾는다.
- 공통 생성/완공이 필수 컴포넌트/버퍼와 초기 enable 상태를 일관되게 부착하는지 직접 소비 쿼리까지 확인한다.
- Ready가 보장하는 범위와 실제 필수 설정 gate를 구분한다. JSON/프리팹 필드 존재만으로 현재 Producer/기능 구현을 인정하지 않는다.
